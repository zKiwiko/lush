[package]
name = "lush"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
glob = "0.3.1"
mlua = { version = "0.12.0-rc.1", features = ["lua55"] }
pkg-config = "0.3.30"
regex = "1.12.3"
serde_json = "1.0.149"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
debug = "limited"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 3
